name: Deploy speaking functions

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/speaking-functions.yml"

permissions:
  contents: read

concurrency:
  group: speaking-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        id: secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${SUPABASE_ACCESS_TOKEN}" ] && missing+=("SUPABASE_ACCESS_TOKEN")
          [ -z "${SUPABASE_PROJECT_REF}" ] && missing+=("SUPABASE_PROJECT_REF")
          [ -z "${GEMINI_API_KEY}" ] && missing+=("GEMINI_API_KEY")
          [ -z "${AZURE_SPEECH_KEY}" ] && missing+=("AZURE_SPEECH_KEY")
          [ -z "${AZURE_SPEECH_REGION}" ] && missing+=("AZURE_SPEECH_REGION")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "GitHub の Actions 秘密がまだありません: ${missing[*]}"
            echo "docs/english.md の「スピーキングを有効にする」を見て追加し、このワークフローを手動で再実行してください。"
            echo "秘密の値はこのログに出しません。デプロイはスキップします。"
            exit 0
          fi
          if ! [[ "${SUPABASE_PROJECT_REF}" =~ ^[a-z0-9]{20}$ ]]; then
            echo "SUPABASE_PROJECT_REF は、プロジェクトの Reference ID（英小文字と数字で20文字）です。"
            exit 1
          fi
          if ! [[ "${AZURE_SPEECH_REGION}" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "AZURE_SPEECH_REGION は japaneast や eastus のようなリージョン名です。"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup Supabase CLI
        if: steps.secrets.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set function secrets and deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          set -euo pipefail
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            GEMINI_API_KEY="$GEMINI_API_KEY" \
            AZURE_SPEECH_KEY="$AZURE_SPEECH_KEY" \
            AZURE_SPEECH_REGION="$AZURE_SPEECH_REGION"
          supabase secrets unset OPENAI_API_KEY --project-ref "$SUPABASE_PROJECT_REF" || true
          supabase functions delete realtime-session --project-ref "$SUPABASE_PROJECT_REF" --yes || true
          supabase functions deploy conversation-reply --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy speech-token --project-ref "$SUPABASE_PROJECT_REF"
          echo "conversation-reply と speech-token をデプロイしました。秘密の値はログに残していません。"
