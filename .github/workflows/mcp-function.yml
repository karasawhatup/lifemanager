name: Deploy MCP function

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/mcp/**"
      - "supabase/functions/_shared/mcp/**"
      - "supabase/config.toml"
      - ".github/workflows/mcp-function.yml"

permissions:
  contents: read

concurrency:
  group: mcp-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        id: secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${SUPABASE_ACCESS_TOKEN}" ] && missing+=("SUPABASE_ACCESS_TOKEN")
          ref="${SUPABASE_PROJECT_REF:-oynfsgxgpsotvbqbpksl}"
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "GitHub の Actions 秘密がまだありません: ${missing[*]}"
            echo "docs/mcp.md の「デプロイ」を見て追加し、このワークフローを手動で再実行してください。"
            echo "秘密の値はこのログに出しません。デプロイはスキップします。"
            exit 0
          fi
          if ! [[ "${ref}" =~ ^[a-z0-9]{20}$ ]]; then
            echo "SUPABASE_PROJECT_REF は、プロジェクトの Reference ID（英小文字と数字で20文字）です。"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "project_ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Setup Supabase CLI
        if: steps.secrets.outputs.ready == 'true'
        uses: supabase/setup-cli@v3
        with:
          # CLI v3 はホストの変更の前に確認する。--project-ref ではなく --remote=<ref> を使う。
          # v4 では --project-ref が無くなる想定なので、フラグが合う 3 系に留める。
          version: "^3"

      - name: Deploy MCP function
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ steps.secrets.outputs.project_ref }}
        run: |
          set -euo pipefail
          # CLI v3 はホストの変更の前に確認する。Actions には端末が無いので --yes を付ける。
          # --remote=<ref> は = でつなぎ、最後に置く。
          supabase functions deploy mcp --yes --remote="$SUPABASE_PROJECT_REF"
          echo "mcp をデプロイしました。service_role はこの関数の中だけで使います。GitHub の秘密には入れません。"
